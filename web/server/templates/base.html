<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#14151a">
  <!-- iOS ignores <meta name="theme-color">'s app-chrome effect but does use
       these two for standalone/Add-to-Home-Screen: capable + a status-bar
       style matched to the dark theme (default-ish, but explicit rather than
       left undefined). -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Proxyshop">
  <title>{% block title %}Proxyshop{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/img/favicon.ico" sizes="any">
  <link rel="icon" href="/static/img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/app.css?v={{ asset_version }}">
  <script src="/static/app.js?v={{ asset_version }}" defer></script>
</head>
<body>
  <header>
    <h1><a href="/" class="brand">
      <img src="/static/img/logo-96.png" alt="" class="brand-logo" width="28" height="28">
      Proxyshop</a></h1>
    {% set path = request.url.path if request else '' %}
    <nav aria-label="Main">
      <a href="/" {% if path == '/' %}aria-current="page"{% endif %}>Editor</a>
      <a href="/gallery" {% if path.startswith('/gallery') or path.startswith('/card/') or path.startswith('/search') %}aria-current="page"{% endif %}>Card library <span id="nav-cache-badge" class="nav-badge" hidden></span></a>
      <a href="/decks" {% if path.startswith('/decks') %}aria-current="page"{% endif %}>Decks</a>
      <a href="/logs" {% if path.startswith('/logs') %}aria-current="page"{% endif %}>Logs</a>
      <a href="/settings" {% if path.startswith('/settings') %}aria-current="page"{% endif %}>Settings</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {# Outside <main> so position:fixed isn't trapped by main's transform animation. #}
  <div class="card-modal" id="card-modal" hidden aria-modal="true" role="dialog" aria-labelledby="card-modal-title">
    <div class="card-modal-backdrop" data-modal-close tabindex="-1"></div>
    <div class="card-modal-dialog" role="document">
      <div class="card-modal-header">
        <h2 id="card-modal-title">Card</h2>
        <button type="button" class="card-modal-close" data-modal-close aria-label="Close">Close</button>
      </div>
      <div class="card-modal-body" id="card-modal-body">
        <p class="muted">Loading…</p>
      </div>
    </div>
  </div>
</body>
</html>
